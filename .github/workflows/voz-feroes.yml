name: Exportar a voz do feroês

# Baixa o MMS-TTS do feroês (Hugging Face), exporta para ONNX (scripts/exportar-voz-mms.py) e
# grava em public/vozes/fo/ no branch escolhido. Só roda à mão (cada exportação põe ~114 MB no
# histórico do git), e nunca no master: o resultado entra por um PR, revisado.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.46.3 onnx==1.17.0 onnxruntime==1.20.1 soundfile numpy huggingface_hub
      - run: python scripts/exportar-voz-mms.py
      - uses: actions/upload-artifact@v4
        with:
          name: amostras-feroes
          path: amostras/
      - name: Gravar no branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vozes/fo src/data/fo/voz-teste.json
          git commit -m 'Voz neural do feroês: MMS-TTS (Meta) exportado para ONNX' || exit 0
          git push
